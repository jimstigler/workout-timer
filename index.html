<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Isometric Loop">
<title>My Isometric Loop</title>
<style>
  :root {
    --work: #ff5a4e;
    --rest: #4ecdc4;
    --bg: #0d0f14;
    --panel: #171a21;
    --text: #f2f2f2;
    --dim: #7a8090;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 60px) 20px calc(env(safe-area-inset-bottom) + 72px) 20px;
    height: 100vh;
    overflow: hidden;
  }
  .top {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding-top: 8px;
  }
  .progress-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    margin-bottom: 4px;
  }
  .stat-block {
    text-align: center;
  }
  .stat-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--rest);
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: 34px;
    font-weight: 700;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .progress-section.hidden { display: none; }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 480px;
    min-height: 0;
  }
  .phase-label {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--work);
    transition: color 0.25s;
  }
  .phase-label.rest { color: var(--rest); }
  .exercise-name {
    font-size: 24px;
    font-weight: 700;
    margin: 2px 0 10px 0;
    text-align: center;
    min-height: 30px;
  }
  .timer-ring {
    position: relative;
    width: min(52vw, 220px);
    height: min(52vw, 220px);
  }
  .timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--panel); stroke-width: 10; }
  .ring-fg {
    fill: none;
    stroke: var(--work);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear, stroke 0.25s;
  }
  .ring-fg.rest { stroke: var(--rest); }
  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .next-up {
    margin-top: 12px;
    color: var(--dim);
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    min-height: 28px;
  }
  .next-up span { color: var(--text); font-weight: 700; }

  .loop-title {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 10px auto;
    padding: 12px 16px;
    background: var(--panel);
    border: 1.5px solid var(--rest);
    border-radius: 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-align: center;
    transition: border-color 0.25s;
  }
  .loop-title.work-phase { border-color: var(--work); }
  .loop-setup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 10px;
  }
  .loop-setup button {
    flex: none;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
  }
  .loop-setup .loop-value {
    min-width: 100px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .loop-setup.hidden { display: none; }

  .home-label {
    color: var(--dim);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .exercise-list {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .exercise-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 600;
  }
  .exercise-list .num {
    color: var(--dim);
    font-weight: 700;
    font-size: 14px;
    min-width: 18px;
  }

  .controls {
    width: 100%;
    max-width: 320px;
    display: flex;
    gap: 12px;
    padding: 12px 0 4px 0;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 700;
    border-radius: 14px;
    border: none;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  #startPauseBtn { background: var(--work); }
  #startPauseBtn.rest-color { background: var(--rest); }
  #resetBtn { background: var(--panel); color: var(--dim); flex: 0.6; }
  button:active { opacity: 0.75; }

  .done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .done-screen.show { display: flex; }
  .done-screen h1 { font-size: 32px; margin-bottom: 8px; }
  .done-screen p { color: var(--dim); font-size: 16px; }
</style>
</head>
<body>

<div class="top">
  <div class="loop-title" id="loopTitle">My Isometric Loop</div>
  <div class="loop-setup" id="loopSetup">
    <button id="loopDecBtn" aria-label="Fewer loops">&minus;</button>
    <div class="loop-value" id="loopValue">5 loops</div>
    <button id="loopIncBtn" aria-label="More loops">&plus;</button>
  </div>
  <div class="progress-section" id="progressSection">
    <div class="progress-row">
      <div class="stat-block">
        <div class="stat-label">Loop</div>
        <div class="stat-value" id="loopCount">1/5</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Exercise</div>
        <div class="stat-value" id="exerciseCount">1/5</div>
      </div>
    </div>
  </div>
</div>

<div class="center" id="homeScreen">
  <div class="home-label">Exercises</div>
  <ol class="exercise-list" id="exerciseList"></ol>
</div>

<div class="center" id="mainScreen">
  <div class="phase-label" id="phaseLabel">Get Ready</div>
  <div class="exercise-name" id="exerciseName">Isometric Loop</div>
  <div class="timer-ring">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="time-display" id="timeDisplay">--</div>
  </div>
  <div class="next-up" id="nextUp">&nbsp;</div>
</div>

<div class="center done-screen" id="doneScreen">
  <h1>&#127881; Done!</h1>
  <p>Nice work. Loop complete.</p>
</div>

<div class="controls">
  <button id="resetBtn">Reset</button>
  <button id="startPauseBtn">Start</button>
</div>

<script>
// ---- HARD-CODED WORKOUT DATA (edit here for v1) ----
const LOOP_TITLE = "My Isometric Loop";
const WORK_SECONDS = 30;
const REST_SECONDS = 10;
const EXERCISES = [
  "Adductor squeeze",
  "Wall squat",
  "Isometric deadlift",
  "Right calf",
  "Left calf"
];
const DEFAULT_LOOPS = 5;   // how many times through the exercise list, editable in-app before starting
const MIN_LOOPS = 1;
const MAX_LOOPS = 10;
const INCLUDE_INTRO = true;   // adds one warm-up rest before the very first exercise (announces it), shown once per session only
const INTRO_SECONDS = REST_SECONDS;
// -------------------------------------------------

let loopCount = DEFAULT_LOOPS;
let sessionStarted = false; // becomes true on first Start tap; locks the loop-count stepper

// Build the full flat sequence for the chosen number of loops.
// Each step carries which loop number (1-indexed) and, for work/rest pairs,
// which exercise number (1-indexed) it belongs to — stored explicitly so the
// on-screen counters stay correct even with the intro step shifting indices.
let sequence = [];
function buildSequence() {
  sequence = [];
  if (INCLUDE_INTRO) {
    // One-time lead-in: counts down and announces the first exercise, only before Loop 1.
    sequence.push({ type: 'rest', duration: INTRO_SECONDS, loop: 1, exerciseNumber: null, intro: true });
  }
  for (let loop = 1; loop <= loopCount; loop++) {
    EXERCISES.forEach((name, i) => {
      const exerciseNumber = i + 1;
      const isVeryLastExercise = (loop === loopCount) && (i === EXERCISES.length - 1);
      sequence.push({ type: 'work', name, duration: WORK_SECONDS, loop, exerciseNumber });
      if (!isVeryLastExercise) {
        sequence.push({ type: 'rest', duration: REST_SECONDS, loop, exerciseNumber });
      }
    });
  }
}
buildSequence();

// Looks ahead from a given index to find the name of the next work step (used for
// "Next up" text and the voice announcement). Works seamlessly across loop boundaries.
function getNextWorkName(afterIndex) {
  for (let i = afterIndex + 1; i < sequence.length; i++) {
    if (sequence[i].type === 'work') return sequence[i].name;
  }
  return null;
}

let stepIndex = 0;
let remaining = sequence[0].duration;
let running = false;
let intervalId = null;
let wakeLock = null;

const loopSetupEl = document.getElementById('loopSetup');
const loopValueEl = document.getElementById('loopValue');
const loopDecBtn = document.getElementById('loopDecBtn');
const loopIncBtn = document.getElementById('loopIncBtn');
const loopTitleEl = document.getElementById('loopTitle');
const loopCountEl = document.getElementById('loopCount');
const exerciseCountEl = document.getElementById('exerciseCount');
const phaseLabelEl = document.getElementById('phaseLabel');
const exerciseNameEl = document.getElementById('exerciseName');
const timeDisplayEl = document.getElementById('timeDisplay');
const nextUpEl = document.getElementById('nextUp');
const ringFgEl = document.getElementById('ringFg');
const startPauseBtn = document.getElementById('startPauseBtn');
const resetBtn = document.getElementById('resetBtn');
const mainScreen = document.getElementById('mainScreen');
const doneScreen = document.getElementById('doneScreen');
const homeScreen = document.getElementById('homeScreen');
const progressSectionEl = document.getElementById('progressSection');
const exerciseListEl = document.getElementById('exerciseList');

const RADIUS = 90;
const CIRC = 2 * Math.PI * RADIUS;
ringFgEl.style.strokeDasharray = CIRC;

// Populate the home-screen exercise list once from EXERCISES
exerciseListEl.innerHTML = EXERCISES.map((name, i) =>
  `<li><span class="num">${i + 1}</span>${name}</li>`
).join('');

loopTitleEl.textContent = LOOP_TITLE;
updateLoopValueDisplay();

function updateLoopValueDisplay() {
  loopValueEl.textContent = `${loopCount} loop${loopCount === 1 ? '' : 's'}`;
}

function render() {
  const step = sequence[stepIndex];
  const isRest = step.type === 'rest';

  loopCountEl.textContent = `${step.loop}/${loopCount}`;
  // Exercise number is stored per-step at build time (not derived from position),
  // so it stays correct even with the one-time intro step shifting indices.
  // During the intro (exerciseNumber is null), show "Exercise 1" as a preview.
  const exerciseNumber = step.exerciseNumber || 1;
  exerciseCountEl.textContent = `${exerciseNumber}/${EXERCISES.length}`;
  phaseLabelEl.textContent = isRest ? 'Rest' : 'Work';
  phaseLabelEl.classList.toggle('rest', isRest);
  loopTitleEl.classList.toggle('work-phase', !isRest);
  exerciseNameEl.textContent = isRest ? 'Rest' : step.name;
  timeDisplayEl.textContent = remaining;
  ringFgEl.classList.toggle('rest', isRest);

  const frac = remaining / step.duration;
  ringFgEl.style.strokeDashoffset = CIRC * (1 - frac);

  if (isRest) {
    const nextName = getNextWorkName(stepIndex);
    nextUpEl.innerHTML = nextName ? `Next: <span>${nextName}</span>` : '<span>Last one!</span>';
  } else {
    const next = sequence[stepIndex + 1];
    nextUpEl.innerHTML = next ? `Next: <span>Rest</span>` : '<span>Last one!</span>';
  }

  startPauseBtn.classList.toggle('rest-color', isRest);
}

// ---- Audio ----
let audioCtx = null;
function beep(freq = 880, duration = 0.15, delay = 0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.85, audioCtx.currentTime + delay + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration + 0.05);
  } catch (e) { /* audio unavailable */ }
}
function transitionSignal(toRest) {
  // two-tone signal: higher pitch = go work, lower = rest
  beep(toRest ? 520 : 880, 0.18, 0);
  beep(toRest ? 520 : 880, 0.18, 0.22);
  if (navigator.vibrate) navigator.vibrate(toRest ? [120, 60, 120] : [200]);
}
function ding() {
  // a single clean bell-like tone marking the actual start of the new segment,
  // played right after the transition beeps finish
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 1046.5; // C6
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.9, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.55);
  } catch (e) { /* audio unavailable */ }
}

// ---- Pre-recorded "Next: <exercise>" voice clips (hardcoded mp3s as base64 data URIs) ----
// Keyed by exercise name — must match the names in the EXERCISES array above exactly.
// To swap a clip later: replace the data URI string for that name with a new one

let nextUpAudioEl = null;
function playNextUpClip(name) {
  if (!name) return; // nothing announced on the final cooldown (no next exercise)
  const src = NEXT_UP_AUDIO[name];
  if (!src) return; // no clip recorded for this exercise name
  try {
    if (!nextUpAudioEl) nextUpAudioEl = new Audio();
    nextUpAudioEl.pause();
    nextUpAudioEl.currentTime = 0;
    nextUpAudioEl.src = src;
    nextUpAudioEl.play().catch(() => { /* playback blocked, ignore */ });
  } catch (e) { /* audio unavailable */ }
}
function playAllDoneClip() {
  try {
    if (!nextUpAudioEl) nextUpAudioEl = new Audio();
    nextUpAudioEl.pause();
    nextUpAudioEl.currentTime = 0;
    nextUpAudioEl.src = ALL_DONE_AUDIO;
    nextUpAudioEl.play().catch(() => { /* playback blocked, ignore */ });
  } catch (e) { /* audio unavailable */ }
}
function countdownTick(n) {
  beep(660, 0.08, 0);
  if (navigator.vibrate) navigator.vibrate(30);
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* ignore */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (running && document.visibilityState === 'visible') requestWakeLock();
});

function tick() {
  remaining -= 1;

  if (remaining <= 3 && remaining > 0) {
    countdownTick(remaining);
  }

  if (remaining <= 0) {
    stepIndex += 1;
    if (stepIndex >= sequence.length) {
      finish();
      return;
    }
    const nextStep = sequence[stepIndex];
    remaining = nextStep.duration;
    transitionSignal(nextStep.type === 'rest');
    setTimeout(() => ding(), 450); // marks the actual start of the new segment
    if (nextStep.type === 'rest') {
      // play after the transition beeps + ding finish, so nothing overlaps
      const nextName = getNextWorkName(stepIndex);
      setTimeout(() => playNextUpClip(nextName), 900);
    }
  }
  render();
}

function showHomeScreen() {
  homeScreen.style.display = 'flex';
  mainScreen.style.display = 'none';
  doneScreen.classList.remove('show');
  progressSectionEl.classList.add('hidden');
}
function showMainScreen() {
  homeScreen.style.display = 'none';
  mainScreen.style.display = 'flex';
  doneScreen.classList.remove('show');
  progressSectionEl.classList.remove('hidden');
}
function showDoneScreen() {
  homeScreen.style.display = 'none';
  mainScreen.style.display = 'none';
  doneScreen.classList.add('show');
}
showHomeScreen(); // initial state on page load

function start() {
  if (running) return;
  const isFreshSessionStart = !sessionStarted;
  running = true;
  sessionStarted = true;
  loopSetupEl.classList.add('hidden'); // lock loop count once a session is underway
  showMainScreen();
  startPauseBtn.textContent = 'Pause';
  requestWakeLock();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // If we're beginning fresh on the one-time intro step, announce the first exercise
  // right away (this step is entered directly on load, not via a tick() transition,
  // so it needs its own trigger here rather than relying on the usual transition logic).
  if (isFreshSessionStart && sequence[stepIndex] && sequence[stepIndex].intro) {
    const firstName = getNextWorkName(stepIndex - 1);
    setTimeout(() => playNextUpClip(firstName), 300);
  }
  intervalId = setInterval(tick, 1000);
}
function pause() {
  running = false;
  startPauseBtn.textContent = 'Resume';
  clearInterval(intervalId);
  releaseWakeLock();
}
function reset() {
  pause();
  sessionStarted = false;
  loopSetupEl.classList.remove('hidden');
  stepIndex = 0;
  buildSequence();   // rebuild in case loopCount changed since the prior session
  remaining = sequence[0].duration;
  startPauseBtn.textContent = 'Start';
  showHomeScreen();
  render();
}

function changeLoopCount(delta) {
  if (sessionStarted) return; // locked once a session has started
  const next = loopCount + delta;
  if (next < MIN_LOOPS || next > MAX_LOOPS) return;
  loopCount = next;
  updateLoopValueDisplay();
  buildSequence();
  remaining = sequence[0].duration;
  render();
}
loopDecBtn.addEventListener('click', () => changeLoopCount(-1));
loopIncBtn.addEventListener('click', () => changeLoopCount(1));
function finish() {
  pause();
  beep(660, 0.15, 0);
  beep(880, 0.15, 0.18);
  beep(1100, 0.25, 0.36);
  if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 300]);
  setTimeout(() => playAllDoneClip(), 500); // let the fanfare beeps finish first
  reset(); // immediately back to the home screen, ready for another session
}

startPauseBtn.addEventListener('click', () => {
  if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // iOS Safari sometimes needs more than resume() to fully unlock tone playback —
  // actually starting and stopping a silent oscillator synchronously within this
  // tap reliably unlocks it for the later async beep() calls during the workout.
  try {
    const unlockOsc = audioCtx.createOscillator();
    const unlockGain = audioCtx.createGain();
    unlockGain.gain.value = 0.00001;
    unlockOsc.connect(unlockGain);
    unlockGain.connect(audioCtx.destination);
    unlockOsc.start(audioCtx.currentTime);
    unlockOsc.stop(audioCtx.currentTime + 0.01);
  } catch (e) { /* ignore */ }
  // iOS Safari only allows programmatic <audio> playback (like our later setTimeout
  // calls) if that exact element instance already played something during a real
  // user gesture. So here, on tap, we play one of the real clips muted, then reset
  // it — this "primes" the element for silent background use. The reset happens on
  // a fixed timer rather than waiting on the play() promise, so a hung/unresolved
  // promise can't leave the element stuck muted (which would silence all later clips).
  if (!nextUpAudioEl) {
    nextUpAudioEl = new Audio();
    const firstClip = Object.values(NEXT_UP_AUDIO)[0];
    if (firstClip) {
      nextUpAudioEl.src = firstClip;
      nextUpAudioEl.muted = true;
      const playPromise = nextUpAudioEl.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
      setTimeout(() => {
        nextUpAudioEl.pause();
        nextUpAudioEl.currentTime = 0;
        nextUpAudioEl.muted = false;
      }, 150);
    }
  }
  running ? pause() : start();
});
resetBtn.addEventListener('click', reset);

render();
</script>
</body>
</html>
